<style>
:root{--navy:#0E2A47;--ink:#14212E;--sub:#556575;--accent:#F2B705;--ok:#1F8F55;--red:#B3261E;--paper:#F5F7F9;--rule:#DCE3EA}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.4 "Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:8px;color:var(--navy);text-decoration:none;font-weight:700;font-size:.92rem}
.brand svg{width:28px;height:24px}
.lang{font:600 .9rem inherit;color:var(--navy);background:#fff;border:1.5px solid #C9D3DD;border-radius:8px;padding:6px 8px}
main{max-width:520px;margin:0 auto;padding:12px 12px 24px}
h1{margin:6px 0 2px;font-size:1.55rem;line-height:1.1;color:var(--navy);letter-spacing:-.02em}
.hint{margin:0 0 10px;color:var(--sub);font-size:.95rem}
.bar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border-radius:50%;background:#E3E8EE;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff;transition:background .2s,transform .2s}
.dots i.on{background:var(--ok);transform:scale(1.1)}
.timer{font:700 1rem inherit;color:var(--navy);font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 #C9D3DD,0 8px 20px rgba(14,42,71,.12);background:#fff;touch-action:manipulation}
.stage svg{display:block;width:100%;height:auto}
.toast{min-height:44px;margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--rule);font-weight:600;color:var(--navy);opacity:0;transform:translateY(6px);transition:.25s}
.toast.show{opacity:1;transform:none}
.toast .ic{font-size:1.4rem}
.hz{cursor:pointer}
.ring{fill:none;stroke:var(--ok);stroke-width:4;opacity:0}
.hz.found .ring{opacity:1;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.hz .ring{transform-box:fill-box;transform-origin:center}
.miss{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;animation:fade .7s forwards}
@keyframes fade{0%{opacity:1}100%{opacity:0}}
.end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(14,42,71,.92);color:#fff;text-align:center;padding:20px}
.end.show{display:flex;animation:fadein .3s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.end .big{font-size:2.6rem;line-height:1;letter-spacing:4px}
.end b{font-size:1.5rem}
.end .t{color:#C9D6E3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:700;text-decoration:none;border:0;font-size:1rem;cursor:pointer}
.btn.y{background:var(--accent);color:var(--navy)}
.btn.w{background:transparent;color:#fff;border:1.5px solid #fff}
.note{margin-top:14px;font-size:.8rem;color:var(--sub);text-align:center}
[dir=rtl] .bar,[dir=rtl] .top{flex-direction:row-reverse}
</style>
</head>

function apply(l){L=l;var d=D[l];document.querySelectorAll('[data-k]').forEach(function(e){var v=d[e.getAttribute('data-k')];if(v)e.textContent=v});document.documentElement.lang=l;document.documentElement.dir=(l==='ar'||l==='ur')?'rtl':'ltr';sel.value=l;try{localStorage.setItem('inf-lang',l)}catch(e){}}
sel.addEventListener('change',function(){apply(sel.value)});
function show(i){ti.textContent=IC[i];tx.textContent=SL[L][cur][i];toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(function(){toast.classList.remove('show')},2600)}
function start(){if(t0)return;t0=Date.now();tick=setInterval(function(){document.getElementById('tm').textContent=Math.floor((Date.now()-t0)/1000)},250)}
var svg=document.getElementById('sc');
var ruolo=((location.search.match(/[?&]r=([a-z]+)/)||[])[1])||'tutti';var set=SETS[ruolo]||SETS.tutti,cur=-1;
function load(){var fs=(location.search.match(/[?&]s=(\d+)/)||[])[1];var opts=set.filter(function(x){return x!==cur});cur=(fs!=null&&cur<0)?+fs:opts[Math.floor(Math.random()*opts.length)];IC=SC[cur].ic;document.getElementById('scene').innerHTML=SC[cur].svg;bind()}
function bind(){document.querySelectorAll('.hz').forEach(function(g){g.addEventListener('click',function(ev){ev.stopPropagation();start();var i=+g.dataset.i;if(found.indexOf(i)>=0){show(i);return}
found.push(i);g.classList.add('found');document.querySelectorAll('.dots i')[found.length-1].classList.add('on');document.querySelectorAll('.dots i')[found.length-1].textContent='✓';show(i);
if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}
if(found.length===5){clearInterval(tick);var s=Math.floor((Date.now()-t0)/1000);document.getElementById('tt').textContent=s;document.getElementById('mm').textContent=miss;var st=(miss<=1&&s<=40)?3:(miss<=4&&s<=90)?2:1;document.getElementById('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);document.getElementById('lbl').textContent=D[L]['s'+st];setTimeout(function(){document.getElementById('end').classList.add('show')},900)}})})}
svg.addEventListener('click',function(ev){start();if(found.length<5)miss++;var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;var c=p.matrixTransform(svg.getScreenCTM().inverse());var x=document.createElementNS('http://www.w3.org/2000/svg','path');x.setAttribute('d','M'+(c.x-8)+' '+(c.y-8)+'l16 16M'+(c.x+8)+' '+(c.y-8)+'l-16 16');x.setAttribute('class','miss');svg.appendChild(x);setTimeout(function(){x.remove()},700)});
document.getElementById('again').addEventListener('click',function(){found=[];t0=null;miss=0;clearInterval(tick);document.getElementById('tm').textContent='0';document.querySelectorAll('.dots i').forEach(function(d){d.classList.remove('on');d.textContent=''});document.getElementById('end').classList.remove('show');load()});
apply(pick());load();try{var r=document.referrer;if(r&&r.indexOf(location.host)>0)document.getElementById('back').href=r}catch(e){}
})();
</script>
</body>
</html>
